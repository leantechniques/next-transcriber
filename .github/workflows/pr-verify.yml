name: PR Verification

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

jobs:
  verify_pr:
    name: Verify PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Type check TypeScript
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test -- --run
        env:
          NODE_ENV: test

      - name: Build Next.js application
        run: npm run build
        env:
          NODE_ENV: production
